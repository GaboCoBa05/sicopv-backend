# ===================================================================
# Microservicio SiCoPV - Realtime WebSocket / STOMP Service
# ===================================================================

# Configuración del servidor HTTP / WebSocket
server.port=8080

# Identificación de la aplicación en el ecosistema Spring
spring.application.name=sicopv-realtime

# Codificación de caracteres estándar UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Niveles de registro de auditoría
logging.level.root=INFO
logging.level.com.tsr.sicopv=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

