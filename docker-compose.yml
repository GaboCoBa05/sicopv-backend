version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sicopv_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sicopv_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/baseDeDatos/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/baseDeDatos/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  node-core-service:
    build: ./backend/node-core-service
    container_name: sicopv_node_core
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=sicopv_db
      - DB_PORT=5432
      - JWT_SECRET=secreto_vibecode_sicopv_2026
    depends_on:
      - db

  spring-realtime-service:
    build: ./backend/spring-realtime-service
    container_name: sicopv_spring_realtime
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
