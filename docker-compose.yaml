version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sicopv_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sicopv_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  backend:
    build: .
    container_name: sicopv_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=sicopv_db
      - DB_PORT=5432
      - JWT_SECRET=secreto_vibecode_sicopv_2026
    depends_on:
      - db

volumes:
  pgdata: