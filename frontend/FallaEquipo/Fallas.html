<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiCoPV - Reporte de Falla de Equipo</title>

    <!-- Dependencias WebSocket: SockJS y STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        :root {
            --primary: #0B3B36;
            --primary-light: #135D54;
            --accent: #A8DDCB;
            --accent-soft: #D4EBE5;
            --bg: #F5F6F4;
            --card-bg: #FFFFFF;
            --text-main: #10484B;
            --text-muted: #5A8A87;
            --border: #CAD7DC;
            --danger: #E63946;
            --success: #2A9D8F;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .barra {
            height: 62px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .barra-izq {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .barra h2 {
            font-size: 19px;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .ws-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
        }

        .ws-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffaa00;
        }

        .ws-dot.online {
            background: #2ec4b6;
            box-shadow: 0 0 6px #2ec4b6;
        }

        .btn-volver {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
        }

        .btn-volver:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .contenedor {
            flex: 1;
            width: 1100px;
            max-width: calc(100% - 30px);
            margin: 20px auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(11, 59, 54, 0.06);
        }

        .encabezado {
            background: var(--primary);
            color: white;
            padding: 20px 30px;
            border-bottom: 3px solid var(--accent);
        }

        .encabezado h1 {
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .encabezado p {
            font-size: 13px;
            color: var(--accent);
        }

        .contenido-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 24px;
            padding: 24px 30px;
        }

        .panel {
            background: #EAF4F1;
            border: 1px solid #D0E0DC;
            border-radius: 10px;
            padding: 18px 20px;
            margin-bottom: 16px;
        }

        .panel-qr {
            background: #D4EBE5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .btn-qr {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-qr:hover {
            background: var(--primary-light);
        }

        .campo {
            margin-bottom: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #FFFFFF;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(11, 59, 54, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .btn-enviar {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-enviar:hover:not(:disabled) {
            background: var(--primary-light);
        }

        .alert-box {
            margin: 16px 30px;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .alert-box.success {
            background: #D4EDDA;
            color: #155724;
            display: block;
        }

        .alert-box.error {
            background: #F8D7DA;
            color: #721C24;
            display: block;
        }

        @media (max-width: 800px) {
            .contenido-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="barra">
        <div class="barra-izq">
            <h2>FALLAS - TSR SALTILLO</h2>
            <div class="ws-badge">
                <span class="ws-dot" id="wsDot"></span>
                <span id="wsText">WS Conectando...</span>
            </div>
        </div>
        <a href="seleccion.html" class="btn-volver">&larr; Menú Principal</a>
    </header>

    <main class="contenedor">
        <section class="encabezado">
            <h1>Levantamiento de Reporte de Falla</h1>
            <p>Genera folio automático, pone el equipo en paro y emite alerta en tiempo real a los técnicos.</p>
        </section>

        <div id="alertaBox" class="alert-box"></div>

        <form id="formFalla">
            <div class="contenido-grid">

                <!-- COLUMNA IZQUIERDA -->
                <div>
                    <!-- PANEL QR -->
                    <div class="panel panel-qr">
                        <div>
                            <h3 style="font-size:14px;color:var(--primary);margin-bottom:2px;">Lectura de Código QR</h3>
                            <p style="font-size:12px;color:var(--text-muted);">Escanea o introduce la clave del equipo
                                para autocompletar.</p>
                        </div>
                        <button type="button" class="btn-qr" onclick="leerQR()">Leer QR</button>
                    </div>

                    <!-- DATOS DE EQUIPO -->
                    <div class="panel">
                        <input type="hidden" id="equipo_id" value="1">
                        <div class="grid-2">
                            <div class="campo">
                                <label for="numSerie">Número de Serie</label>
                                <input type="text" id="numSerie" placeholder="Ej. TRN-001" required>
                            </div>
                            <div class="campo">
                                <label for="ubicacion">Ubicación / Celda</label>
                                <input type="text" id="ubicacion" placeholder="Línea 1 - Torneado" required>
                            </div>
                        </div>
                        <div class="campo">
                            <label for="nombreEquipo">Nombre del Equipo</label>
                            <input type="text" id="nombreEquipo" placeholder="Ej. Torno Mazak Quick Turn 250" required>
                        </div>
                    </div>

                    <!-- CLASIFICACIÓN -->
                    <div class="panel">
                        <div class="grid-2">
                            <div class="campo">
                                <label for="tipoFalla">Tipo de Falla</label>
                                <select id="tipoFalla" required>
                                    <option value="Mecánica">Mecánica</option>
                                    <option value="Eléctrica">Eléctrica</option>
                                    <option value="Hidráulica">Hidráulica</option>
                                    <option value="Neumática">Neumática</option>
                                    <option value="Software / PLC">Software / PLC</option>
                                    <option value="Otra">Otra</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label for="prioridad">Prioridad de Atención</label>
                                <select id="prioridad" required>
                                    <option value="BAJA">Baja</option>
                                    <option value="MEDIA" selected>Media</option>
                                    <option value="ALTA">Alta</option>
                                    <option value="CRITICA">Crítica (Paro total)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- COLUMNA DERECHA -->
                <div>
                    <div class="panel">
                        <div class="campo">
                            <label for="descripcion">Descripción de la Falla *</label>
                            <textarea id="descripcion"
                                placeholder="Detalla la anomalía, ruidos observados, vibraciones o alarmas..."
                                required></textarea>
                        </div>
                        <div class="campo">
                            <label for="descAdicional">Descripción Adicional (Opcional)</label>
                            <textarea id="descAdicional"
                                placeholder="Notas del operador, pieza involucrada, condición del herramental..."></textarea>
                        </div>
                    </div>

                    <button type="submit" class="btn-enviar" id="btnEnviar">ENVIAR REPORTE DE FALLA</button>
                </div>

            </div>
        </form>
    </main>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        const WS_URL = 'http://localhost:8081/ws-sicopv';
        let stompClient = null;

        // Conectar STOMP WebSocket
        function initSTOMP() {
            try {
                const socket = new SockJS(WS_URL);
                stompClient = Stomp.over(socket);
                stompClient.debug = null;
                stompClient.connect({}, () => {
                    document.getElementById('wsDot').className = 'ws-dot online';
                    document.getElementById('wsText').textContent = 'WS Conectado';
                }, () => {
                    document.getElementById('wsDot').className = 'ws-dot';
                    document.getElementById('wsText').textContent = 'WS Desconectado';
                    setTimeout(initSTOMP, 5000);
                });
            } catch (e) {
                console.warn('STOMP no disponible');
            }
        }

        // Simular o leer código QR consultando GET /api/equipos/qr/:codigo
        async function leerQR() {
            const codigo = prompt('Ingresa el código QR o Número de Serie:\nEjemplo: QR-TSR-TRN-001 o TRN-001', 'QR-TSR-TRN-001');
            if (!codigo) return;

            try {
                const res = await fetch(`${API_BASE}/equipos/qr/${encodeURIComponent(codigo)}`);
                const eq = await res.json();
                if (!res.ok) throw new Error(eq.error || 'Equipo no encontrado');

                document.getElementById('equipo_id').value = eq.id;
                document.getElementById('numSerie').value = eq.numero_serie;
                document.getElementById('nombreEquipo').value = eq.nombre;
                document.getElementById('ubicacion').value = eq.ubicacion_area;
                mostrarAlerta(`Equipo "${eq.nombre}" cargado por QR con éxito.`, 'success');
            } catch (err) {
                mostrarAlerta(err.message, 'error');
            }
        }

        function mostrarAlerta(msg, tipo = 'success') {
            const b = document.getElementById('alertaBox');
            b.className = `alert-box ${tipo}`;
            b.textContent = msg;
            b.style.display = 'block';
        }

        // Envío del reporte de falla
        document.getElementById('formFalla').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;

            const payload = {
                equipo_id: document.getElementById('equipo_id').value,
                tipo_falla: document.getElementById('tipoFalla').value,
                descripcion: document.getElementById('descripcion').value.trim(),
                descripcion_adicional: document.getElementById('descAdicional').value.trim(),
                prioridad: document.getElementById('prioridad').value
            };

            try {
                // 1. POST /api/fallas
                const res = await fetch(`${API_BASE}/fallas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al levantar reporte');

                // 2. WebSocket Broadcast STOMP
                if (stompClient && stompClient.connected) {
                    stompClient.send('/app/reportar-falla', {}, JSON.stringify({
                        folioIncidencia: data.folio,
                        equipoNombre: document.getElementById('nombreEquipo').value,
                        ubicacion: document.getElementById('ubicacion').value,
                        tipoFalla: payload.tipo_falla,
                        prioridad: payload.prioridad,
                        timestamp: new Date().toISOString()
                    }));
                }

                mostrarAlerta(`¡Falla registrada con éxito! Folio generado: ${data.folio}. Máquina colocada en PARO y alerta emitida en tiempo real.`, 'success');
                document.getElementById('descripcion').value = '';
                document.getElementById('descAdicional').value = '';
            } catch (err) {
                mostrarAlerta(err.message, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        window.addEventListener('DOMContentLoaded', initSTOMP);
    </script>
</body>

</html>
