<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar Técnico - SiCoPV / AFYP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f7f4; color: #0b3b36; min-height: 100vh; }
.barra { background: #0b3b36; height: 58px; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.inicio { color: white; text-decoration: none; font-size: 26px; }
.contenedor { width: 1100px; max-width: calc(100% - 30px); margin: 20px auto; display: grid; grid-template-columns: 420px 1fr; gap: 24px; }
.card { background: white; border: 1px solid #cad7dc; border-radius: 12px; padding: 22px 26px; box-shadow: 0 4px 12px rgba(11, 59, 54, 0.05); }
.card h1 { font-size: 18px; color: #0b3b36; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #a8ddcb; }
.campo { margin-bottom: 13px; }
label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #0b3b36; }
input, select { width: 100%; padding: 10px 12px; border: 1.5px solid #cad7dc; border-radius: 6px; font-size: 13px; outline: none; }
input:focus, select:focus { border-color: #0b3b36; box-shadow: 0 0 0 2px rgba(11, 59, 54, 0.15); }
.btn-submit { width: 100%; padding: 13px; background: #0b3b36; color: white; border: none; border-radius: 7px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn-submit:hover { background: #135d54; }
.alerta { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-top: 12px; display: none; }
.alerta.error { background: #f8d7da; color: #721c24; display: block; }
.alerta.success { background: #d4edda; color: #155724; display: block; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
th { background: #eaf4f1; color: #0b3b36; padding: 10px 12px; text-align: left; font-weight: 700; border-bottom: 2px solid #cad7dc; }
td { padding: 10px 12px; border-bottom: 1px solid #edf1f2; }
.badge-area { background: #d4ebe5; color: #0b3b36; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; }
@media(max-width:850px){ .contenedor { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="barra">
    <div style="display:flex;align-items:center;gap:16px;">
        <a href="../FallaEquipo/seleccion.html" class="inicio" title="Menú Principal">&#8962;</a>
        <h2 style="font-size:19px;letter-spacing:1.5px;">ALTA DE PERSONAL TÉCNICO &bull; SiCoPV</h2>
    </div>
    <div style="font-size:13px;font-weight:bold;background:rgba(255,255,255,0.15);padding:5px 14px;border-radius:20px;">
        SUPERVISIÓN
    </div>
</header>

<main class="contenedor">

    <!-- FORMULARIO DE ALTA -->
    <section class="card">
        <h1>Registrar Técnico</h1>
        <form id="formTecnico" novalidate>
            <div class="campo">
                <label for="usuario">Usuario / Nómina *</label>
                <input type="text" id="usuario" placeholder="Ej. rgonzalez o TSR-1045" required>
            </div>
            <div class="campo">
                <label for="correo">Correo Electrónico *</label>
                <input type="email" id="correo" placeholder="tecnico@tsr-saltillo.com" required>
            </div>
            <div class="campo">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
            </div>
            <div class="campo">
                <label for="area">Área Asignada *</label>
                <select id="area" required>
                    <option value="">Selecciona un área...</option>
                    <option value="Mantenimiento">Mantenimiento</option>
                    <option value="Eléctrica">Eléctrica</option>
                    <option value="Mecánica">Mecánica</option>
                    <option value="Robótica">Robótica</option>
                    <option value="Producción">Producción</option>
                </select>
            </div>
            <div class="campo">
                <label for="especialidad">Especialidad *</label>
                <input type="text" id="especialidad" placeholder="Ej. PLC Siemens, Servomotores, Hidráulica" required>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">REGISTRAR TÉCNICO</button>
            <div id="alertaBox" class="alerta"></div>
        </form>
    </section>

    <!-- PADRÓN ACTIVO -->
    <section class="card">
        <h1>Personal Técnico Registrado</h1>
        <div style="overflow-x:auto;">
            <table>
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Área</th>
                        <th>Especialidad</th>
                        <th>Correo</th>
                    </tr>
                </thead>
                <tbody id="tbodyTecnicos">
                    <tr><td colspan="4" style="text-align:center;color:#5a8a87;">Cargando técnicos...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script>
const API = 'http://localhost:3000/api/tecnicos';
const alerta = document.getElementById('alertaBox');

async function cargarTecnicos() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        const tbody = document.getElementById('tbodyTecnicos');
        tbody.innerHTML = '';

        data.forEach(t => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${t.nombre_usuario || t.usuario}</strong></td>
                <td><span class="badge-area">${t.area}</span></td>
                <td>${t.especialidad}</td>
                <td>${t.correo}</td>
            `;
            tbody.appendChild(tr);
        });
    } catch (e) {
        document.getElementById('tbodyTecnicos').innerHTML = '<tr><td colspan="4" style="color:#a22;">Error al cargar técnicos.</td></tr>';
    }
}

document.getElementById('formTecnico').addEventListener('submit', async (e) => {
    e.preventDefault();
    alerta.style.display = 'none';

    const usuario = document.getElementById('usuario').value.trim();
    const correo = document.getElementById('correo').value.trim();
    const password = document.getElementById('password').value;
    const area = document.getElementById('area').value;
    const especialidad = document.getElementById('especialidad').value.trim();

    if (!usuario || !correo || !password || !area || !especialidad) {
        alerta.className = 'alerta error';
        alerta.textContent = 'Verificar información previa - Error en registro: Todos los campos son obligatorios.';
        return;
    }

    try {
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario, correo, password, area, especialidad })
        });
        const data = await res.json();
        if (!res.ok) {
            throw new Error(data.error || 'Verificar información previa - Error en registro');
        }

        alerta.className = 'alerta success';
        alerta.textContent = '¡Técnico registrado exitosamente!';
        document.getElementById('formTecnico').reset();
        cargarTecnicos();
    } catch (err) {
        alerta.className = 'alerta error';
        alerta.textContent = err.message;
    }
});

window.addEventListener('DOMContentLoaded', cargarTecnicos);
</script>
</body>
</html>
