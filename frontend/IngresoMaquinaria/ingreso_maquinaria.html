<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso de Maquinaria - SiCoPV / AFYP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7f8; color: #0b3b36; min-height: 100vh; }
.barra { height: 60px; background: #0b3b36; color: white; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
.barra h2 { font-size: 19px; letter-spacing: 1.5px; font-weight: 600; }
.inicio { color: white; text-decoration: none; font-size: 26px; }
.contenedor { width: 1200px; max-width: calc(100% - 30px); margin: 20px auto; display: grid; grid-template-columns: 420px 1fr; gap: 24px; }
.card { background: white; border: 1px solid #cad7dc; border-radius: 12px; padding: 22px 26px; box-shadow: 0 4px 12px rgba(11, 59, 54, 0.05); }
.card h1 { font-size: 18px; color: #0b3b36; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #a8ddcb; }
.campo { margin-bottom: 12px; }
label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; color: #0b3b36; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #cad7dc; border-radius: 6px; font-size: 13px; color: #10484b; outline: none; }
input:focus, select:focus, textarea:focus { border-color: #0b3b36; box-shadow: 0 0 0 2px rgba(11, 59, 54, 0.15); }
textarea { resize: vertical; min-height: 70px; }
.btn-guardar { width: 100%; background: #0b3b36; color: white; border: none; border-radius: 7px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn-guardar:hover { background: #135d54; }
.tabla-wrap { overflow-x: auto; margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #eaf4f1; color: #0b3b36; padding: 10px 12px; text-align: left; font-weight: 700; border-bottom: 2px solid #cad7dc; }
td { padding: 10px 12px; border-bottom: 1px solid #edf1f2; vertical-align: middle; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.badge-operativo { background: #d4edda; color: #155724; }
.badge-paro { background: #f8d7da; color: #721c24; }
.badge-mtto { background: #fff3cd; color: #856404; }
.btn-qr-view { background: #d4ebe5; border: 1px solid #0b3b36; color: #0b3b36; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 11px; cursor: pointer; }
.btn-qr-view:hover { background: #0b3b36; color: white; }

/* MODAL DE CÓDIGO QR */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 200; }
.modal-overlay.activo { display: flex; }
.modal-qr { background: white; border-radius: 12px; padding: 26px; text-align: center; max-width: 360px; width: 90%; }
.qr-frame { width: 180px; height: 180px; margin: 16px auto; border: 4px solid #0b3b36; border-radius: 8px; padding: 10px; display: flex; align-items: center; justify-content: center; background: #fff; }
.btn-print { background: #0b3b36; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 8px; }
.btn-cerrar { background: #e2e8f0; color: #333; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
@media(max-width:850px){ .contenedor { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="barra">
    <div style="display:flex;align-items:center;gap:16px;">
        <a href="../FallaEquipo/seleccion.html" class="inicio" title="Menú Principal">&#8962;</a>
        <h2>INGRESO DE MAQUINARIA &bull; SiCoPV</h2>
    </div>
    <div style="font-size:13px;font-weight:bold;background:rgba(255,255,255,0.15);padding:5px 14px;border-radius:20px;">
        GESTIÓN DE ACTIVOS
    </div>
</header>

<main class="contenedor">

    <!-- FORMULARIO DE ALTA -->
    <section class="card">
        <h1>Registrar Nueva Maquinaria</h1>
        <form id="formEquipo">
            <div class="campo">
                <label for="serie">Número de Serie *</label>
                <input type="text" id="serie" placeholder="Ej. TRN-003, PRN-003, ROB-004" required>
            </div>
            <div class="campo">
                <label for="nombre">Nombre / Modelo de Máquina *</label>
                <input type="text" id="nombre" placeholder="Ej. Torno CNC Haas ST-40" required>
            </div>
            <div class="campo">
                <label for="ubicacion">Ubicación / Área *</label>
                <select id="ubicacion" required>
                    <option value="">Selecciona ubicación...</option>
                    <option value="Línea 1 - Torneado">Línea 1 - Torneado</option>
                    <option value="Línea 2 - Estampado">Línea 2 - Estampado</option>
                    <option value="Celda 3 - Robótica">Celda 3 - Robótica</option>
                    <option value="Área de Ensamble">Área de Ensamble</option>
                    <option value="Taller de Mantenimiento">Taller de Mantenimiento</option>
                </select>
            </div>
            <div class="campo">
                <label for="funcion">Descripción / Función *</label>
                <textarea id="funcion" placeholder="Indicar funciones críticas, tolerancias o celda asignada..." required></textarea>
            </div>
            <button type="submit" class="btn-guardar" id="btnGuardar">REGISTRAR Y GENERAR QR</button>
        </form>
    </section>

    <!-- INVENTARIO DINÁMICO -->
    <section class="card">
        <h1>Inventario de Maquinaria y Códigos QR</h1>
        <div class="tabla-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Serie</th>
                        <th>Nombre</th>
                        <th>Ubicación</th>
                        <th>Estado</th>
                        <th>Código QR</th>
                    </tr>
                </thead>
                <tbody id="tbodyEquipos">
                    <tr><td colspan="5" style="text-align:center;color:#5a8a87;">Cargando catálogo...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<!-- MODAL CÓDIGO QR -->
<div class="modal-overlay" id="modalQR">
    <div class="modal-qr">
        <h3 id="qrModalNombre" style="color:#0b3b36;font-size:16px;">ETIQUETA INDUSTRIAL</h3>
        <p id="qrModalSerie" style="font-size:13px;color:#5a8a87;margin-top:2px;"></p>
        
        <div class="qr-frame">
            <!-- Simulación SVG de código QR de alta resolución -->
            <svg id="qrSvg" width="150" height="150" viewBox="0 0 100 100">
                <rect x="0" y="0" width="100" height="100" fill="white"/>
                <!-- Esquinas de posicionamiento QR -->
                <rect x="10" y="10" width="24" height="24" fill="#0b3b36"/>
                <rect x="14" y="14" width="16" height="16" fill="white"/>
                <rect x="17" y="17" width="10" height="10" fill="#0b3b36"/>
                
                <rect x="66" y="10" width="24" height="24" fill="#0b3b36"/>
                <rect x="70" y="14" width="16" height="16" fill="white"/>
                <rect x="73" y="17" width="10" height="10" fill="#0b3b36"/>

                <rect x="10" y="66" width="24" height="24" fill="#0b3b36"/>
                <rect x="14" y="70" width="16" height="16" fill="white"/>
                <rect x="17" y="73" width="10" height="10" fill="#0b3b36"/>

                <!-- Patrón de datos QR simulado -->
                <rect x="42" y="15" width="6" height="6" fill="#0b3b36"/>
                <rect x="52" y="20" width="8" height="6" fill="#0b3b36"/>
                <rect x="40" y="38" width="20" height="6" fill="#0b3b36"/>
                <rect x="25" y="45" width="12" height="6" fill="#0b3b36"/>
                <rect x="65" y="45" width="15" height="8" fill="#0b3b36"/>
                <rect x="42" y="55" width="16" height="6" fill="#0b3b36"/>
                <rect x="40" y="70" width="10" height="12" fill="#0b3b36"/>
                <rect x="60" y="75" width="24" height="10" fill="#0b3b36"/>
            </svg>
        </div>

        <p id="qrModalCadena" style="font-size:12px;font-weight:bold;color:#0b3b36;margin-bottom:18px;"></p>

        <div>
            <button type="button" class="btn-print" onclick="window.print()">Imprimir Etiqueta</button>
            <button type="button" class="btn-cerrar" onclick="cerrarQR()">Cerrar</button>
        </div>
    </div>
</div>

<script>
const API = 'http://localhost:3000/api/equipos';

async function cargarEquipos() {
    try {
        const res = await fetch(API);
        const data = await res.json();
        const tbody = document.getElementById('tbodyEquipos');
        tbody.innerHTML = '';

        data.forEach(eq => {
            const tr = document.createElement('tr');
            let badgeClass = 'badge-operativo';
            if (eq.estado === 'EN_PARO') badgeClass = 'badge-paro';
            if (eq.estado === 'MANTENIMIENTO') badgeClass = 'badge-mtto';

            tr.innerHTML = `
                <td><strong>${eq.numero_serie}</strong></td>
                <td>${eq.nombre}</td>
                <td>${eq.ubicacion_area}</td>
                <td><span class="badge ${badgeClass}">${eq.estado}</span></td>
                <td>
                    <button class="btn-qr-view" onclick="verQR('${eq.nombre}', '${eq.numero_serie}', '${eq.codigo_qr}')">
                        Ver / Imprimir QR
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (e) {
        document.getElementById('tbodyEquipos').innerHTML = '<tr><td colspan="5" style="color:#a22;">Error al cargar equipos.</td></tr>';
    }
}

function verQR(nombre, serie, qr) {
    document.getElementById('qrModalNombre').textContent = nombre;
    document.getElementById('qrModalSerie').textContent = `Serie: ${serie}`;
    document.getElementById('qrModalCadena').textContent = qr;
    document.getElementById('modalQR').classList.add('activo');
}

function cerrarQR() {
    document.getElementById('modalQR').classList.remove('activo');
}

document.getElementById('formEquipo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true;

    const payload = {
        numero_serie: document.getElementById('serie').value.trim(),
        nombre: document.getElementById('nombre').value.trim(),
        ubicacion_area: document.getElementById('ubicacion').value,
        descripcion_funcion: document.getElementById('funcion').value.trim()
    };

    try {
        const res = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error al registrar');

        alert(`¡Máquina ${data.equipo.nombre} registrada con éxito!\nCódigo QR generado: ${data.equipo.codigo_qr}`);
        document.getElementById('formEquipo').reset();
        cargarEquipos();
        verQR(data.equipo.nombre, data.equipo.numero_serie, data.equipo.codigo_qr);
    } catch (err) {
        alert(err.message);
    } finally {
        btn.disabled = false;
    }
});

window.addEventListener('DOMContentLoaded', cargarEquipos);
</script>
</body>
</html>
