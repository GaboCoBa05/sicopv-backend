<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiCoPV / AFYP - Iniciar Sesión</title>
    <style>
        :root {
            --primary: #0B3B36;
            --primary-light: #135D54;
            --accent: #A8DDCB;
            --accent-hover: #8DCEB8;
            --bg: #F5F6F4;
            --card-bg: #0B3B36;
            --text-light: #FFFFFF;
            --text-dark: #10484B;
            --input-bg: #F8FAF9;
            --error: #E63946;
            --success: #2A9D8F;
            --border: #D2DEDB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(11, 59, 54, 0.08) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(168, 221, 203, 0.2) 0%, transparent 30%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 480px;
            max-width: 100%;
            background: var(--card-bg);
            color: var(--text-light);
            padding: 40px 36px 36px;
            border-radius: 14px;
            box-shadow: 0 16px 35px rgba(11, 59, 54, 0.3);
            position: relative;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent), #258C82);
            border-radius: 14px 14px 0 0;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(168, 221, 203, 0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border: 1px solid rgba(168, 221, 203, 0.3);
        }

        .brand-header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .brand-header p {
            font-size: 13px;
            color: #B0D0CE;
            margin-top: 4px;
        }

        /* NAVEGACIÓN POR PESTAÑAS (LOGIN, REGISTRO, RECUPERAR) */
        .tabs {
            display: flex;
            border-bottom: 1px solid rgba(168, 221, 203, 0.25);
            margin-bottom: 22px;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 4px;
            color: #B0D0CE;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-align: center;
        }

        .tab-btn.activo {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.activo {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #D1ECE5;
            margin-bottom: 5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            border-radius: 7px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(168, 221, 203, 0.3);
            background: #ffffff;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: var(--text-dark);
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert-box {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert-box.error {
            display: block;
            background: rgba(230, 57, 70, 0.25);
            border: 1px solid rgba(230, 57, 70, 0.6);
            color: #FFCCD0;
        }

        .alert-box.success {
            display: block;
            background: rgba(42, 157, 143, 0.25);
            border: 1px solid rgba(42, 157, 143, 0.6);
            color: #C7F9CC;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <main class="login-card">
        <header class="brand-header">
            <span class="brand-badge">TSR Saltillo &bull; AFYP</span>
            <h1>SiCoPV</h1>
            <p>Control de Paros y Ventanillas de Mantenimiento</p>
        </header>

        <!-- PESTAÑAS -->
        <nav class="tabs">
            <button type="button" class="tab-btn activo" onclick="mostrarTab('login', this)">Iniciar Sesión</button>
            <button type="button" class="tab-btn" onclick="mostrarTab('registro', this)">Crear Cuenta</button>
            <button type="button" class="tab-btn" onclick="mostrarTab('reset', this)">Actualizar Contraseña</button>
        </nav>

        <!-- PANEL 1: INICIAR SESIÓN -->
        <section id="panel-login" class="tab-panel activo">
            <form id="formLogin" novalidate>
                <div class="form-group">
                    <label for="correoLogin">Correo Electrónico o Usuario</label>
                    <input type="text" id="correoLogin" placeholder="usuario@tsr-saltillo.com o admin" required>
                </div>
                <div class="form-group">
                    <label for="passLogin">Contraseña</label>
                    <input type="password" id="passLogin" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" id="btnLogin">INICIAR SESIÓN</button>
            </form>
        </section>

        <!-- PANEL 2: CREAR CUENTA -->
        <section id="panel-registro" class="tab-panel">
            <form id="formRegistro" novalidate>
                <div class="form-group">
                    <label for="regUsuario">Nombre de Usuario</label>
                    <input type="text" id="regUsuario" placeholder="Ej. rgonzalez" required>
                </div>
                <div class="form-group">
                    <label for="regCorreo">Correo Electrónico</label>
                    <input type="email" id="regCorreo" placeholder="colaborador@tsr-saltillo.com" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="regRol">Rol Operativo</label>
                    <select id="regRol" required>
                        <option value="OPERADOR">OPERADOR (Piso de planta)</option>
                        <option value="TECNICO">TECNICO (Mantenimiento)</option>
                        <option value="SUPERVISOR">SUPERVISOR (Línea)</option>
                        <option value="JEFE_MANTTO">JEFE DE MANTENIMIENTO</option>
                        <option value="CALIDAD">CALIDAD</option>
                        <option value="ADMIN">ADMINISTRADOR</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">REGISTRAR CUENTA</button>
            </form>
        </section>

        <!-- PANEL 3: ACTUALIZAR CONTRASEÑA -->
        <section id="panel-reset" class="tab-panel">
            <form id="formReset" novalidate>
                <div class="form-group">
                    <label for="resetCorreo">Correo Registrado</label>
                    <input type="email" id="resetCorreo" placeholder="correo@tsr-saltillo.com" required>
                </div>
                <div class="form-group">
                    <label for="resetCodigo">Código de Verificación (Opcional)</label>
                    <input type="text" id="resetCodigo" placeholder="TSR-XXXX">
                </div>
                <div class="form-group">
                    <label for="resetPass">Nueva Contraseña</label>
                    <input type="password" id="resetPass" placeholder="Nueva contraseña segura" minlength="8" required>
                </div>
                <button type="submit" class="btn-submit">ACTUALIZAR CONTRASEÑA</button>
            </form>
        </section>

        <!-- MENSAJE DE ESTADO -->
        <div id="alertaBox" class="alert-box" role="alert"></div>
    </main>

    <script>
        const API_URL = 'http://localhost:3000/api/auth';
        const alertaBox = document.getElementById('alertaBox');

        function mostrarTab(tab, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('activo'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
            document.getElementById('panel-' + tab).classList.add('activo');
            btn.classList.add('activo');
            alertaBox.style.display = 'none';
        }

        function setAlerta(msg, tipo = 'error') {
            alertaBox.className = `alert-box ${tipo}`;
            alertaBox.textContent = msg;
            alertaBox.style.display = 'block';
        }

        function redirigirSegunRol(rol) {
            const r = (rol || '').toUpperCase();
            if (r === 'ADMIN' || r === 'JEFE_MANTTO' || r === 'SUPERVISOR') {
                window.location.href = '../Dashboard/dashboard.html';
            } else if (r === 'TECNICO') {
                window.location.href = '../BitacoraDigital/bitacora_digital.html';
            } else {
                window.location.href = '../FallaEquipo/fallas.html';
            }
        }

        // 1. INICIAR SESIÓN
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('correoLogin').value.trim();
            const password = document.getElementById('passLogin').value;

            if (!email || !password) return setAlerta('Ingresa tu correo y contraseña.');

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al iniciar sesión.');

                localStorage.setItem('token', data.token);
                localStorage.setItem('usuario', JSON.stringify(data.user));
                localStorage.setItem('rol', data.user.rol);

                setAlerta('Inicio de sesión exitoso. Redirigiendo...', 'success');
                setTimeout(() => redirigirSegunRol(data.user.rol), 600);
            } catch (err) {
                setAlerta(err.message);
            }
        });

        // 2. CREAR CUENTA
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre_usuario = document.getElementById('regUsuario').value.trim();
            const correo = document.getElementById('regCorreo').value.trim();
            const password = document.getElementById('regPassword').value;
            const rol = document.getElementById('regRol').value;

            if (!nombre_usuario || !correo || !password) return setAlerta('Completa todos los campos obligatorios.');

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre_usuario, correo, password, rol })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error en registro.');

                setAlerta('Cuenta creada con éxito. Ahora puedes iniciar sesión.', 'success');
                document.getElementById('formRegistro').reset();
            } catch (err) {
                setAlerta(err.message);
            }
        });

        // 3. ACTUALIZAR CONTRASEÑA
        document.getElementById('formReset').addEventListener('submit', async (e) => {
            e.preventDefault();
            const correo = document.getElementById('resetCorreo').value.trim();
            const codigo_verificacion = document.getElementById('resetCodigo').value.trim();
            const nueva_contrasena = document.getElementById('resetPass').value;

            if (!correo || !nueva_contrasena) return setAlerta('Ingresa tu correo y la nueva contraseña.');

            try {
                const res = await fetch(`${API_URL}/reset-password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo, codigo_verificacion, nueva_contrasena })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Error al actualizar contraseña.');

                setAlerta(data.message || 'Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
                document.getElementById('formReset').reset();
            } catch (err) {
                setAlerta(err.message);
            }
        });
    </script>
</body>

</html>
